version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/api"
    schedule:
      interval: "weekly"
    groups:
      all-updates:
        patterns:
          - "*"
    ignore:
      # ts-jest 29 peers on typescript "<7" and Next 16 rejects the TS 7
      # compiler API, so major TypeScript bumps break the build here.
      # Remove once both support TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/dash"
    schedule:
      interval: "weekly"
    groups:
      all-updates:
        patterns:
          - "*"
    ignore:
      # eslint-plugin-react (via eslint-config-next) supports ESLint 9 at
      # most, so hold the eslint major back too.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # ts-jest 29 peers on typescript "<7" and Next 16 rejects the TS 7
      # compiler API, so major TypeScript bumps break the build here.
      # Remove once both support TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-updates:
        patterns:
          - "*"
